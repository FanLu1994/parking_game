<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>马路显眼包 · 素质模拟器</title>
  <style>
    /* 本地子集化字体（tools/subset_fonts.py 生成）；缺失时回退系统字体 */
    @font-face {
      font-family: "ZCOOL KuaiLe";
      src: url("fonts/zcool-kuaile-subset.woff2") format("woff2");
      font-display: swap;
    }
    @font-face {
      font-family: "Noto Sans SC";
      src: url("fonts/noto-sans-sc-subset.woff2") format("woff2");
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0d0f12;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
    }
    #gameCanvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/car.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/level_data.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/parking_scene.js"></script>
  <script src="js/driving_scene.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
